.review-toolbar{max-width:1200px;margin:auto;padding:16px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}.review-brand{font-size:1.125rem;font-weight:700}.review-controls{display:flex;gap:8px;flex-wrap:wrap;max-width:100%}.review-controls label{display:flex;gap:4px;flex-direction:column;font-size:.75rem;max-width:100%}.review-controls select{font-size:.875rem;padding:8px 12px;min-width:96px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--ink);max-width:240px}.review-controls button{align-self:end;background:var(--primary);color:var(--on-primary);font-size:.875rem}.review-note{max-width:780px;margin:0 auto 16px;padding:0 16px;font-size:.875rem;color:var(--muted);text-align:center}
.preview-stage{display:flex;justify-content:center;padding:0 16px 24px}.phone{width:100%;max-width:420px;min-width:0;height:900px;max-height:calc(100dvh - 190px);min-height:510px;border:1px solid var(--border);border-radius:28px;background:var(--canvas);display:flex;flex-direction:column;position:relative;box-shadow:0 12px 32px #203a3210;overflow:hidden}.prototype-label{font-size:.75rem;font-weight:700;line-height:1.75;background:var(--accent-soft);color:var(--ink);padding:8px 12px;text-align:center;flex:none}.screen-header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);flex:none}.screen-header h1{font-size:1.125rem;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}.icon-button{padding:10px;display:flex;align-items:center;justify-content:center;flex:none;width:48px;min-height:48px;color:var(--primary);background:var(--primary-soft)}.header-actions{display:flex;gap:4px;flex:none}.screen-content{flex:1;min-height:0;overflow:auto;overflow-x:hidden;padding:20px 16px;scrollbar-width:thin;overflow-wrap:anywhere}.bottom-nav{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;background:var(--surface);border-top:1px solid var(--border);padding:6px 4px max(6px,env(safe-area-inset-bottom));box-shadow:0 -2px 16px #203a3210}.bottom-nav button{font-size:.75rem;min-width:48px;min-height:64px;padding:6px 2px;border-radius:12px;display:flex;align-items:center;flex-direction:column;gap:2px;line-height:1.65;color:var(--muted)}.bottom-nav button[aria-current=page]{background:var(--primary-soft);color:var(--primary);font-weight:700}.bottom-nav button span{max-width:100%;overflow-wrap:anywhere}.screen-footer{font-size:.75rem;padding:8px 12px;background:var(--surface);text-align:center;color:var(--muted);border-top:1px solid var(--border)}
.stack{display:flex;flex-direction:column;gap:12px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.spread{justify-content:space-between}.card{padding:16px;border:1px solid var(--border);border-radius:20px;background:var(--surface);margin-bottom:12px}.hero{background:var(--primary-soft);border-radius:28px;padding:20px;margin-bottom:20px}.hero .eyebrow{font-size:.875rem;font-weight:700;color:var(--primary);margin-bottom:8px}.hero-art{float:left;margin:0 8px 8px 0;width:72px;height:72px;color:var(--primary)}.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 0 12px}.section-title h2{margin:0}.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;min-height:48px;font-size:1rem;background:var(--primary);color:var(--on-primary);border:1px solid var(--primary)}.btn.secondary{background:var(--surface);color:var(--primary)}.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}.btn.wide{width:100%}.btn.small{font-size:.875rem}.button-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.button-row>*{flex:1;min-width:100px}.tag{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:700;border:1px solid var(--border);padding:4px 8px;border-radius:12px;background:var(--primary-soft);color:var(--ink)}.tag.warning{background:var(--accent-soft)}.tag.success{background:var(--success-soft);color:var(--success)}.tag.error{background:var(--danger-soft);color:var(--danger)}.muted{color:var(--muted)}.task{display:flex;align-items:flex-start;gap:12px}.task .task-copy{flex:1;min-width:0}.task h3{font-size:1rem;margin:0 0 4px}.task .helper{margin:0}.task .btn{padding:10px 12px;min-width:72px}.complete-icon{border:2px solid var(--success);background:var(--success-soft);color:var(--success);border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:8px}.progress-track{height:12px;border-radius:12px;background:#d7d     if(action==='practice-check'){practiceChecked=true;render();return;}
    if(kind==='answer'){answers[question]=Number(value);render();return;}
    if(action==='quiz-next'){if(answers[question]===null)return;if(question<9){question++;render();}else navigate('quiz-result');return;}
    if(action==='quiz-retry'){question=0;answers=Array(10).fill(null);navigate('quiz');return;}
    if(action==='consent-check'){consentChecked=target.checked;render();return;}
    if(action==='action-check'){actionChecked=target.checked;render();return;}
    if(kind==='confirm'){pendingAction=value;actionChecked=false;navigate(currentRole()==='parent'?'parent-confirm-action':'confirm-action');return;}
    if(kind==='resolve'){navigate(screen);toast='انتخاب نمونه اعمال شد؛ هیچ همگام‌سازی واقعی انجام نشد.';render();return;}
    if(kind==='reminder'){remindOptions[Number(value)]=!remindOptions[Number(value)];render();return;}
    if(action==='timer-toggle'){timerRunning=!timerRunning;render();return;}
    if(action==='timer-break'){timerRunning=false;timerRest=true;timerSeconds=300;render();return;}
    if(action==='timer-stop'){timerRunning=false;toast='زمان فقط در طرح دیده شد؛ ذخیره یا ارسال نشده است.';navigate('plan');return;}
  });
  document.addEventListener('change', event=>{
    const control=event.target.dataset.control;if(!control)return;
    if(control==='screen')navigate(event.target.value);
    if(control==='state')navigate(screen,event.target.value);
    if(control==='theme')navigate(screen,state,event.target.value);
  });
  setInterval(()=>{if(timerRunning&&screen==='focus'&&timerSeconds>0){timerSeconds--;const el=document.querySelector('[data-qa=timer]');if(el)el.textContent=fa(String(Math.floor(timerSeconds/60)).padStart(2,'0'))+':'+fa(String(timerSeconds%60).padStart(2,'0'));}},1000);
  const url=new URL(location.href);screen=lookup(url.searchParams.get('screen')).id;state=lookup(screen).states.includes(url.searchParams.get('state'))?url.searchParams.get('state'):'normal';theme=url.searchParams.get('theme')==='bright'?'bright':'calm';
  window.LifeGuideDesign={screens,boardFrames,navigate,render,reset,questionCount:questions.length,sampleDataOnly:true,backendConnected:false};
  render();
})();
</script></body></html>
