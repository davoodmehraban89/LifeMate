name: Wire Final Hub
on:
  push:
    branches: ['final-feature-1/iran-family-school']
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-feature-1/iran-family-school
      - name: Wire Iranian hub into profile navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/lifemate/lib/main.dart')
          s=p.read_text()
          if "import 'iran_hub.dart';" not in s:
              s=s.replace("import 'api.dart';\n", "import 'api.dart';\nimport 'iran_hub.dart';\n", 1)
          marker="""                ListTile(\n                  leading: const Icon(Icons.password),\n                  title: const Text('تغییر رمز عبور'),"""
          addition="""                ListTile(\n                  leading: const Icon(Icons.public),\n                  title: const Text('خانواده و یادگیری ایران'),\n                  subtitle: const Text('نقش‌ها، پایه تحصیلی، کتاب‌ها، تقویم و یادآوری'),\n                  onTap: () => Navigator.of(context).push(MaterialPageRoute(\n                    builder: (_) => IranianFamilyLearningHub(identity: widget.api),\n                  )),\n                ),\n"""
          if "IranianFamilyLearningHub(identity: widget.api)" not in s:
              if marker not in s: raise SystemExit('navigation marker not found')
              s=s.replace(marker, addition+marker, 1)
          p.write_text(s)
          PY
          dart_format=''
      - name: Commit wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/lifemate/lib/main.dart
          git commit -m 'feat: expose Iranian family learning hub'
          git push origin HEAD:final-feature-1/iran-family-school
