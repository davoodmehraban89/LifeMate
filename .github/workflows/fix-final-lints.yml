name: Normalize Final Lints
on:
  push:
    branches: ['final-feature-1/iran-family-school']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: final-feature-1/iran-family-school}
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/lifemate/lib/iran_hub.dart');s=p.read_text()
          s=s.replace("if(body!=null)req.body=jsonEncode(body);","if(body!=null){req.body=jsonEncode(body);}")
          s=s.replace("if(res.statusCode<200||res.statusCode>=300)throw Exception('request_failed_${res.statusCode}');","if(res.statusCode<200||res.statusCode>=300){throw Exception('request_failed_${res.statusCode}');}")
          s=s.replace("if(persona=='child')await request('PUT','/v1/me/education',body:{'nationalGrade':grade,'schoolYear':'1405-1406'});","if(persona=='child'){await request('PUT','/v1/me/education',body:{'nationalGrade':grade,'schoolYear':'1405-1406'});}")
          s=s.replace('as List<dynamic>?? const []','as List<dynamic>? ?? const []')
          p.write_text(s)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/lifemate/lib/iran_hub.dart; git commit -m 'fix: satisfy final hub analyzer'; git push origin HEAD:final-feature-1/iran-family-school
