name: Publish LifeGuide public review website

on:
  push:
    branches: [main, feat/public-review-page]
    paths:
      - 'site/review/**'
      - 'scripts/check-review-site.py'
      - '.github/workflows/publish-static.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifeguide-public-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate public content and local assets
        run: python3 scripts/check-review-site.py
      - name: Configure existing GitHub Pages site
        uses: actions/configure-pages@v5
      - name: Record exact published source
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('site/review/build-info.json').write_text(json.dumps({
            'product': 'LifeGuide',
            'purpose': 'public-product-review',
            'commit': os.environ['GITHUB_SHA'],
            'run': os.environ['GITHUB_RUN_ID'],
            'liveLogin': False,
          }, indent=2) + '\n')
          PY
      - name: Upload review website only
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/review
  deploy:
    # Keep the existing main-only deployment policy; feature pushes validate only.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy owner-requested public product review
        id: deployment
        uses: actions/deploy-pages@v4
