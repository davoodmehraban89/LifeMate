name: LifeMate CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed environment files
        run: |
          bad_files=$(find . -type f \( -name '.env' -o -name '.env.*' \) ! -name '.env.example' ! -path './.git/*')
          if [ -n "$bad_files" ]; then echo "Committed environment files detected:"; echo "$bad_files"; exit 1; fi
      - name: Scan high-confidence secret patterns
        run: |
          if git grep -I -n -E '(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{30,}|sk_live_[A-Za-z0-9]{20,})' -- .; then echo "Potential committed secret detected."; exit 1; fi

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lifemate
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - name: Verify PWA release metadata
        run: |
          grep -q 'manifest.json' web/index.html
          grep -q 'theme-color' web/index.html
          grep -q 'apple-touch-icon' web/index.html
          grep -q 'dir="rtl"' web/index.html
          test -f web/manifest.json
      - run: flutter build web --release
      - run: flutter build apk --release
      - name: Upload Web release
        uses: actions/upload-artifact@v4
        with:
          name: lifemate-web-release
          path: apps/lifemate/build/web
          if-no-files-found: error
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: lifemate-android-apk
          path: apps/lifemate/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: lifemate_ci
          POSTGRES_DB: lifemate_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d lifemate_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: lifemate_ci
      DATABASE_URL: postgresql://postgres:lifemate_ci@localhost:5432/lifemate_ci
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply migrations
        run: |
          for migration in backend/migrations/*.sql; do echo "Applying $migration"; psql -h localhost -U postgres -d lifemate_ci -v ON_ERROR_STOP=1 -f "$migration"; done
      - name: Database authorization tests
        run: |
          psql -h localhost -U postgres -d lifemate_ci -v ON_ERROR_STOP=1 -f backend/tests/schema_test.sql
          psql -h localhost -U postgres -d lifemate_ci -v ON_ERROR_STOP=1 -f backend/tests/phase3_schema_test.sql
          if [ -f backend/tests/phase4_schema_test.sql ]; then psql -h localhost -U postgres -d lifemate_ci -v ON_ERROR_STOP=1 -f backend/tests/phase4_schema_test.sql; fi
          if [ -f backend/tests/phase6_schema_test.sql ]; then psql -h localhost -U postgres -d lifemate_ci -v ON_ERROR_STOP=1 -f backend/tests/phase6_schema_test.sql; fi
      - name: Install backend
        working-directory: backend
        run: npm install
      - name: Backend dependency audit
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Backend tests
        working-directory: backend
        run: npm test
      - name: Backend syntax checks
        working-directory: backend
        run: npm run check
      - name: Verify schema objects
        run: |
          test "$(psql -h localhost -U postgres -d lifemate_ci -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name in ('app_user','profile','family_workspace','family_membership','guardian_relationship','family_invitation','access_audit','auth_credential','auth_token','auth_session','life_context','academic_year','academic_term','subject','class_session','plan_item','sharing_grant','reminder','notification_preference','notification_outbox','sync_mutation','learning_goal','learning_checkin','wellbeing_checkin','ai_guide_session','ai_guide_message','ai_plan_proposal','wellbeing_safety_event','education_profile','curriculum_subject','textbook_catalog','iran_calendar_event','menstrual_cycle_entry');")" = "33"
      - name: Backup and restore drill
        run: |
          psql -h localhost -U postgres -d lifemate_ci -v ON_ERROR_STOP=1 -f backend/scripts/restore-smoke.sql
          chmod +x backend/scripts/backup.sh backend/scripts/restore.sh
          backend/scripts/backup.sh /tmp/lifemate-ci.dump
          createdb -h localhost -U postgres lifemate_restore
          DATABASE_URL=postgresql://postgres:lifemate_ci@localhost:5432/lifemate_restore backend/scripts/restore.sh /tmp/lifemate-ci.dump
          test "$(psql -h localhost -U postgres -d lifemate_restore -Atc "select count(*) from profile where display_name='Restore Smoke';")" = "1"
