name: Fix Final Unused
on:
  push:
    branches: ['final-feature-1/iran-family-school']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: final-feature-1/iran-family-school}
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/lifemate/lib/iran_hub.dart');s=p.read_text().replace("final profile=s.data![0],prefs=s.data![3];","final prefs=s.data![3];");p.write_text(s)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add apps/lifemate/lib/iran_hub.dart; git commit -m 'fix: remove unused profile local'; git push origin HEAD:final-feature-1/iran-family-school
