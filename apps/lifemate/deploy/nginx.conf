# One HTTPS origin for PWA, API and operator-signed APK downloads.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream lifeguide_api {
  zone lifeguide_api 64k;
  # nginx >=1.27.3 supports DNS refresh for open-source upstream servers.
  server api-proxy:8080 resolve;
}

server {
  listen 8081;
  server_name localhost;
  location = /gateway-health { access_log off; return 200 'ok'; }
  location / { return 404; }
}

server {
  listen 443 ssl;
  server_name _;
  ssl_certificate /etc/nginx/tls/server.pem;
  ssl_certificate_key /etc/nginx/tls/server-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;
  access_log off;
  error_log /var/log/nginx/error.log crit;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 128k;
  include /etc/nginx/security-headers.inc;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;

  location = /health {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control 'no-store' always;
    proxy_pass http://lifeguide_api/health;
  }
  location = /ready {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control 'no-store' always;
    proxy_pass http://lifeguide_api/ready;
  }
  location = /live {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control 'no-store' always;
    proxy_pass http://lifeguide_api/live;
  }
  location = /api { return 308 /api/; }
  location /api/ {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control 'no-store' always;
    proxy_pass http://lifeguide_api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_buffering off;
  }
  location = /config.json {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control 'no-store' always;
    try_files $uri =404;
  }
  location ~* /(index\.html|manifest\.json|flutter_bootstrap\.js|flutter_service_worker\.js|lifeguide_service_worker\.js|main\.dart\.js)$ {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control 'no-cache, max-age=0, must-revalidate' always;
    try_files $uri =404;
  }
  location /downloads/ {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control 'no-cache, max-age=0, must-revalidate' always;
    try_files $uri =404;
  }
  location / {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control 'no-cache, max-age=0, must-revalidate' always;
    try_files $uri $uri/ /index.html;
  }
}
