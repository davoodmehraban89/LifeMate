<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>لایف‌گاید — اتصال برقرار نیست</title>
  <style>
    body{margin:0;background:#f8fafd;color:#203047;font-family:system-ui,sans-serif;line-height:1.9}
    main{max-width:38rem;margin:12vh auto;padding:2rem;background:white;border-radius:1rem}
    button{padding:.8rem 1.5rem;border:0;border-radius:.6rem;background:#356bb8;color:white;font:inherit;cursor:pointer}
    button:focus-visible{outline:3px solid #203047;outline-offset:4px}
    @media(max-width:42rem){main{margin:5vh 1rem;padding:1.4rem}}
  </style>
</head>
<body>
  <main>
    <h1>لایف‌گاید</h1>
    <p role="status">اتصال برقرار نیست. اطلاعات تازه یا ورود به حساب هنوز تأیید نشده است.</p>
    <p>این صفحه تغییرهای ارسال‌نشده را حذف نمی‌کند. برای ادامه، اتصال را برقرار کنید و دوباره تلاش کنید. داده‌های مرورگر را پاک نکنید.</p>
    <p>اطلاعات خصوصی در این صفحه نمایش داده نمی‌شود.</p>
    <button type="button" id="offline-retry">تلاش دوباره</button>
  </main>
  <script src="offline-retry.js"></script>
</body>
</html>
